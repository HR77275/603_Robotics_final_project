<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CS603 Sam</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <section class="stage" aria-label="Animated voice avatar">
      <div class="bot" id="bot" aria-hidden="true"></div>
      <div class="wave idle-bars" id="wave" aria-hidden="true"></div>
      <div class="scanline"></div>
    </section>

    <section class="console">
      <div class="top">
        <h1>Sam</h1>
        <div class="status" id="status">BOOTING...</div>
      </div>

      <div id="liveText" aria-live="polite">say something</div>

      <div class="switch-row">
        <button id="liveBtn">Tap to listen</button>
      </div>

      <details class="advanced">
        <summary>Settings</summary>
        <div class="mic-row">
          <select id="micPicker" aria-label="Select microphone"></select>
          <button id="whisperBtn" type="button">Whisper: tap to record</button>
        </div>
      </details>

      <details class="advanced">
        <summary>Event log</summary>
        <div class="log" id="log"></div>
      </details>

      <div class="footer">say "follow me", "stop", or "come over"</div>
      <input id="transcript" type="hidden">
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
