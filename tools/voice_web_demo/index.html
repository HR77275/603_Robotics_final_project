<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CS603 Voice Rover</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1014;
      --ink: #f8f1d8;
      --muted: #9fb0a6;
      --panel: #162126;
      --line: #344b4f;
      --green: #65d46e;
      --yellow: #f1c852;
      --red: #ff6767;
      --cyan: #67d2ff;
      --shadow: #050709;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px) 0 0 / 16px 16px,
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px) 0 0 / 16px 16px,
        radial-gradient(circle at 20% 20%, #1b3d36, transparent 36%),
        var(--bg);
      color: var(--ink);
      font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }

    .shell {
      width: min(1120px, 100%);
      height: min(620px, calc(100dvh - 24px));
      min-height: 360px;
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(360px, 1.25fr);
      gap: 14px;
      border: 4px solid var(--line);
      box-shadow: 0 0 0 4px var(--shadow), 0 20px 0 rgba(0,0,0,.28);
      background: #0e1519;
      padding: 14px;
    }

    .stage,
    .console {
      border: 3px solid var(--line);
      background: var(--panel);
      box-shadow: inset 0 0 0 3px #0f171b;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .scanline {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.05) 0,
        rgba(255,255,255,.05) 1px,
        transparent 1px,
        transparent 5px
      );
      pointer-events: none;
      opacity: .45;
    }

    .bot {
      width: min(250px, 64%);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      gap: 4px;
      image-rendering: pixelated;
      animation: idle 1.6s steps(2) infinite;
    }

    .px {
      background: transparent;
    }

    .body { background: var(--cyan); }
    .edge { background: #102a35; }
    .eye { background: var(--yellow); animation: blink 3s steps(1) infinite; }
    .mouth { background: var(--green); }
    .active .mouth { animation: talk .28s steps(2) infinite; }
    .active .eye { background: var(--green); }
    .warn .eye,
    .warn .mouth { background: var(--red); }

    .wave {
      position: absolute;
      bottom: 34px;
      left: 28px;
      right: 28px;
      height: 54px;
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      gap: 6px;
      align-items: end;
    }

    .bar {
      background: var(--green);
      min-height: 6px;
      animation: bars 900ms steps(4) infinite;
      opacity: .55;
    }

    .bar:nth-child(3n) { animation-delay: 120ms; height: 70%; }
    .bar:nth-child(4n) { animation-delay: 240ms; height: 40%; }
    .bar:nth-child(5n) { animation-delay: 360ms; height: 90%; }
    .idle-bars .bar { animation-play-state: paused; height: 8px; background: var(--muted); }

    .console {
      padding: 16px;
      display: grid;
      grid-template-rows: auto auto auto auto 1fr auto;
      gap: 12px;
      min-width: 0;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 38px);
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .status {
      min-width: 180px;
      border: 2px solid var(--line);
      background: #0b1114;
      color: var(--green);
      padding: 8px;
      font-size: 13px;
      text-align: right;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
    }

    input,
    button {
      height: 52px;
      border: 3px solid var(--line);
      border-radius: 0;
      font-family: inherit;
      font-size: 16px;
      color: var(--ink);
      background: #0b1114;
      box-shadow: 0 4px 0 var(--shadow);
    }

    input {
      min-width: 0;
      padding: 0 12px;
    }

    button {
      cursor: pointer;
      padding: 0 14px;
      font-weight: 800;
      text-transform: uppercase;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--shadow);
    }

    .primary {
      background: var(--green);
      color: #07100a;
      border-color: #3f8d49;
    }

    .listen {
      background: var(--yellow);
      color: #211704;
      border-color: #9c7d26;
    }

    .recording {
      background: var(--red);
      border-color: #9b3838;
      color: #fff;
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .chips button {
      height: 46px;
      padding: 0 8px;
      font-size: 13px;
    }

    .switch-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .switch-row button.on {
      background: var(--red);
      border-color: #9b3838;
      color: #fff;
    }

    .log {
      min-height: 0;
      overflow: auto;
      border: 2px solid var(--line);
      background: #090d10;
      color: var(--muted);
      padding: 10px;
      white-space: pre-wrap;
      font-size: 13px;
    }

    .footer {
      color: var(--yellow);
      font-size: 12px;
      line-height: 1.35;
    }

    @keyframes idle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes blink {
      0%, 88%, 100% { opacity: 1; }
      90%, 94% { opacity: .2; }
    }

    @keyframes talk {
      0%, 100% { opacity: 1; transform: scaleY(1); }
      50% { opacity: .6; transform: scaleY(.45); }
    }

    @keyframes bars {
      0% { height: 8px; }
      25% { height: 28px; }
      50% { height: 48px; }
      75% { height: 18px; }
      100% { height: 8px; }
    }

    @media (max-width: 760px) and (orientation: portrait) {
      body::before {
        content: "rotate phone";
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 10;
        background: var(--bg);
        color: var(--yellow);
        font-size: 28px;
        text-transform: uppercase;
      }
    }

    @media (max-width: 860px) and (orientation: landscape) {
      html,
      body {
        overflow: auto;
      }

      .shell {
        height: calc(100dvh - 20px);
        min-height: 0;
        grid-template-columns: 38% 1fr;
        gap: 10px;
        padding: 10px;
      }

      .console {
        padding: 10px;
        gap: 8px;
      }

      .console {
        min-height: 0;
      }

      .input-row,
      .chips,
      .switch-row {
        gap: 6px;
      }

      .chips {
        grid-template-columns: repeat(4, 1fr);
      }

      .chips button {
        height: 38px;
      }

      .switch-row button {
        height: 42px;
      }

      input,
      button {
        height: 46px;
        font-size: 14px;
      }

      .status {
        min-width: 128px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="stage" aria-label="Animated voice avatar">
      <div class="bot" id="bot" aria-hidden="true"></div>
      <div class="wave idle-bars" id="wave" aria-hidden="true"></div>
      <div class="scanline"></div>
    </section>

    <section class="console">
      <div class="top">
        <h1>Voice Rover</h1>
        <div class="status" id="status">BOOTING...</div>
      </div>

      <div class="input-row">
        <input id="transcript" autocomplete="off" autocapitalize="none" placeholder="say: follow me / stop / come over">
        <button class="listen" id="listen" title="Browser speech input">Talk</button>
        <button class="primary" id="publish">Send</button>
      </div>

      <div class="chips">
        <button data-phrase="follow me">follow</button>
        <button data-phrase="stop">stop</button>
        <button data-phrase="come over">come</button>
        <button data-phrase="hold position">hold</button>
      </div>

      <div class="switch-row">
        <button id="always">Always off</button>
      </div>

      <div class="log" id="log"></div>
      <div class="footer">Say “follow me”, “stop”, or “come over”. Publishes /voice_intent only.</div>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");
    const listenEl = document.getElementById("listen");
    const publishEl = document.getElementById("publish");
    const logEl = document.getElementById("log");
    const botEl = document.getElementById("bot");
    const waveEl = document.getElementById("wave");
    const alwaysEl = document.getElementById("always");
    const demoToken = "__CS603_VOICE_DEMO_TOKEN__";
    let alwaysOn = false;
    let recognition = null;
    let recognizing = false;

    const pixels = [
      ".........",
      "..eeeee..",
      ".ebbbbbee",
      ".ebebebee",
      ".ebbbbbee",
      "..bbmbb..",
      ".bbbbbbb.",
      ".b.....b.",
      "........."
    ];

    const bars = 18;
    botEl.innerHTML = pixels.flatMap((row) => row.split("")).map((cell) => {
      const cls = cell === "e" ? "edge" : cell === "b" ? "body" : cell === "m" ? "mouth" : ".";
      if (cell === ".") return "<span class='px'></span>";
      if (row.includes("ebebeb") && cell === "b") return "<span class='px eye'></span>";
      return `<span class='px ${cls}'></span>`;
    }).join("");
    waveEl.innerHTML = Array.from({length: bars}, () => "<span class='bar'></span>").join("");

    function setMode(mode) {
      botEl.classList.toggle("active", mode === "active");
      botEl.classList.toggle("warn", mode === "warn");
      waveEl.classList.toggle("idle-bars", mode !== "active");
    }

    function log(line) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent = `[${time}] ${line}\n` + logEl.textContent;
    }

    async function health() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        statusEl.textContent = data.ok ? "ROS READY" : "BRIDGE ERROR";
        statusEl.style.color = data.ok ? "var(--green)" : "var(--red)";
        if (!data.ok) log(data.error || "health check failed");
      } catch (error) {
        statusEl.textContent = "OFFLINE";
        statusEl.style.color = "var(--red)";
        log(String(error));
      }
    }

    async function publishTranscript(text) {
      const transcript = text.trim();
      if (!transcript) return;
      setMode("active");
      statusEl.textContent = "SENDING...";
      statusEl.style.color = "var(--yellow)";
      try {
        const res = await fetch("/api/intent", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CS603-Voice-Token": demoToken
          },
          body: JSON.stringify({transcript})
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "publish failed");
        statusEl.textContent = data.intent;
        statusEl.style.color = "var(--green)";
        log(`${JSON.stringify(data.commandText || data.transcript)} -> ${data.intent}`);
        setTimeout(() => setMode("idle"), 900);
      } catch (error) {
        statusEl.textContent = "FAILED";
        statusEl.style.color = "var(--red)";
        log(String(error));
        setMode("warn");
      }
    }

    document.querySelectorAll("[data-phrase]").forEach((button) => {
      button.addEventListener("click", () => {
        transcriptEl.value = button.dataset.phrase;
        publishTranscript(transcriptEl.value);
      });
    });

    publishEl.addEventListener("click", () => publishTranscript(transcriptEl.value));
    transcriptEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") publishTranscript(transcriptEl.value);
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      listenEl.disabled = true;
      listenEl.textContent = "Dictate";
      listenEl.title = "Use the phone keyboard dictation mic in the text box";
      alwaysEl.disabled = true;
      alwaysEl.textContent = "Dictate mode";
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.continuous = true;

      recognition.onstart = () => {
        recognizing = true;
        listenEl.classList.add("recording");
        listenEl.textContent = "Live";
        alwaysEl.textContent = alwaysOn ? "Always on" : "Always off";
        statusEl.textContent = "LISTENING...";
        statusEl.style.color = "var(--yellow)";
        setMode("active");
      };

      recognition.onresult = (event) => {
        const last = event.results[event.results.length - 1];
        if (!last.isFinal) return;
        const text = last[0].transcript;
        transcriptEl.value = text;
        publishTranscript(text);
      };

      recognition.onerror = (event) => {
        alwaysOn = false;
        alwaysEl.classList.remove("on");
        alwaysEl.textContent = "Always off";
        statusEl.textContent = "SPEECH ERR";
        statusEl.style.color = "var(--red)";
        log(event.error || "speech recognition error");
        setMode("warn");
      };

      recognition.onend = () => {
        recognizing = false;
        listenEl.classList.remove("recording");
        listenEl.textContent = "Talk";
        if (alwaysOn) {
          setTimeout(() => {
            try {
              recognition.start();
            } catch (_error) {
              // Some mobile browsers throttle immediate restarts.
            }
          }, 450);
        } else if (statusEl.textContent === "LISTENING...") {
          setMode("idle");
          health();
        }
      };

      listenEl.addEventListener("click", () => {
        alwaysOn = false;
        alwaysEl.classList.remove("on");
        alwaysEl.textContent = "Always off";
        if (!recognizing) recognition.start();
      });

      alwaysEl.addEventListener("click", () => {
        alwaysOn = !alwaysOn;
        alwaysEl.classList.toggle("on", alwaysOn);
        alwaysEl.textContent = alwaysOn ? "Always on" : "Always off";
        if (alwaysOn && !recognizing) recognition.start();
        if (!alwaysOn && recognizing) recognition.stop();
        log(`always-on ${alwaysOn ? "enabled" : "disabled"}`);
      });
    }

    health();
  </script>
</body>
</html>
