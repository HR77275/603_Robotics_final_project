<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS603 Voice Intent</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --panel: #ffffff;
      --ink: #142027;
      --muted: #5d6b73;
      --line: #cdd6dc;
      --green: #1f8a4c;
      --yellow: #a66b00;
      --red: #b42318;
      --blue: #1d5fd1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    main {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(20, 32, 39, 0.08);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .status {
      min-width: 132px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      text-align: center;
    }

    .status.ok { color: var(--green); border-color: rgba(31, 138, 76, 0.4); }
    .status.busy { color: var(--yellow); border-color: rgba(166, 107, 0, 0.4); }
    .status.err { color: var(--red); border-color: rgba(180, 35, 24, 0.4); }

    .grid {
      display: grid;
      gap: 16px;
    }

    .ptt {
      height: 96px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }

    .ptt.recording { background: var(--red); }
    .ptt:disabled { background: #9aa8b1; cursor: wait; }

    .result {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
    }

    .field {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 76px;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .value {
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .intent {
      color: var(--green);
      font-weight: 800;
    }

    .manual {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    input,
    select,
    button.secondary {
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    input,
    select {
      min-width: 0;
      padding: 0 12px;
    }

    button.secondary {
      padding: 0 16px;
      cursor: pointer;
      font-weight: 700;
    }

    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .quick button {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 0 12px;
      cursor: pointer;
      color: var(--ink);
      font-weight: 600;
    }

    details {
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 700;
    }

    .settings {
      margin-top: 12px;
      display: grid;
      gap: 12px;
    }

    .log {
      margin-top: 12px;
      max-height: 160px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
      color: var(--muted);
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      main { padding: 16px; }
      header, .result, .manual { display: grid; grid-template-columns: 1fr; }
      .status { min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>CS603 Voice Intent</h1>
      <div class="status" id="status">Checking ROS</div>
    </header>

    <section class="grid" aria-label="Voice intent controls">
      <button class="ptt" id="talkBtn" type="button">Hold to Talk</button>

      <div class="result">
        <div class="field">
          <span class="label">Transcript</span>
          <div class="value" id="transcriptText">No speech yet</div>
        </div>
        <div class="field">
          <span class="label">Intent</span>
          <div class="value intent" id="intentText">-</div>
        </div>
      </div>

      <div class="manual">
        <input id="manualText" type="text" autocomplete="off" placeholder="Type a phrase, e.g. stop">
        <button class="secondary" id="sendTextBtn" type="button">Send Text</button>
      </div>

      <div class="quick" aria-label="Quick commands">
        <button type="button" data-phrase="follow me">follow me</button>
        <button type="button" data-phrase="come here">come here</button>
        <button type="button" data-phrase="stop">stop</button>
        <button type="button" data-phrase="red light">red light</button>
      </div>

      <details>
        <summary>Settings and log</summary>
        <div class="settings">
          <select id="micPicker" aria-label="Select microphone"></select>
          <div class="log" id="log"></div>
        </div>
      </details>
    </section>
  </main>

  <script>
    const demoToken = "__CS603_VOICE_DEMO_TOKEN__";
    const statusEl = document.getElementById("status");
    const talkBtn = document.getElementById("talkBtn");
    const transcriptTextEl = document.getElementById("transcriptText");
    const intentTextEl = document.getElementById("intentText");
    const manualTextEl = document.getElementById("manualText");
    const sendTextBtn = document.getElementById("sendTextBtn");
    const micPickerEl = document.getElementById("micPicker");
    const logEl = document.getElementById("log");

    let selectedMicId = "";
    let mediaRecorder = null;
    let mediaStream = null;
    let recordedChunks = [];
    let busy = false;
    let recording = false;
    let recordStartedAt = 0;

    function setStatus(text, mode) {
      statusEl.textContent = text;
      statusEl.classList.toggle("ok", mode === "ok");
      statusEl.classList.toggle("busy", mode === "busy");
      statusEl.classList.toggle("err", mode === "err");
    }

    function log(line) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent = `[${time}] ${line}\n` + logEl.textContent;
    }

    function setResult(transcript, intent) {
      transcriptTextEl.textContent = transcript || "No speech detected";
      intentTextEl.textContent = intent || "-";
    }

    async function health() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        if (data.ok) {
          setStatus("ROS Ready", "ok");
        } else {
          setStatus("Bridge Error", "err");
          log(data.error || "health check failed");
        }
      } catch (error) {
        setStatus("Offline", "err");
        log(`health error: ${error.message || error}`);
      }
    }

    async function populateMicPicker() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const mics = devices.filter((device) => device.kind === "audioinput");
        micPickerEl.innerHTML = "";
        const defaultOpt = document.createElement("option");
        defaultOpt.value = "";
        defaultOpt.textContent = "Default microphone";
        micPickerEl.appendChild(defaultOpt);
        mics.forEach((mic, index) => {
          const opt = document.createElement("option");
          opt.value = mic.deviceId;
          opt.textContent = mic.label || `Microphone ${index + 1}`;
          micPickerEl.appendChild(opt);
        });
      } catch (error) {
        log(`mic picker error: ${error.message || error}`);
      }
    }

    async function requestMic() {
      const audioConstraint = selectedMicId ? {deviceId: {exact: selectedMicId}} : true;
      return navigator.mediaDevices.getUserMedia({audio: audioConstraint});
    }

    async function startRecording(event) {
      if (event) event.preventDefault();
      if (busy || recording) return;

      try {
        mediaStream = await requestMic();
        recordedChunks = [];
        const opts = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
          ? {mimeType: "audio/webm;codecs=opus"}
          : (MediaRecorder.isTypeSupported("audio/webm") ? {mimeType: "audio/webm"} : {});
        mediaRecorder = new MediaRecorder(mediaStream, opts);
        mediaRecorder.ondataavailable = (evt) => {
          if (evt.data && evt.data.size > 0) recordedChunks.push(evt.data);
        };
        mediaRecorder.onstop = uploadRecording;
        mediaRecorder.start();
        recordStartedAt = Date.now();
        recording = true;
        talkBtn.classList.add("recording");
        talkBtn.textContent = "Release to Send";
        setStatus("Recording", "busy");
        setResult("", "");
      } catch (error) {
        setStatus("Mic Blocked", "err");
        log(`mic error: ${error.message || error}`);
      }
    }

    function stopRecording(event) {
      if (event) event.preventDefault();
      if (!recording || !mediaRecorder || mediaRecorder.state !== "recording") return;
      recording = false;
      mediaRecorder.stop();
      talkBtn.classList.remove("recording");
      talkBtn.textContent = "Hold to Talk";
      setStatus("Transcribing", "busy");
    }

    async function uploadRecording() {
      const durationMs = Date.now() - recordStartedAt;
      const mime = mediaRecorder?.mimeType || "audio/webm";
      const blob = new Blob(recordedChunks, {type: mime});
      cleanupStream();
      recordedChunks = [];

      if (durationMs < 300 || blob.size === 0) {
        setStatus("Too Short", "err");
        log("recording ignored: too short");
        return;
      }

      busy = true;
      talkBtn.disabled = true;
      try {
        const res = await fetch("/api/transcribe", {
          method: "POST",
          headers: {
            "Content-Type": mime,
            "X-CS603-Voice-Token": demoToken
          },
          body: blob
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "transcription failed");

        const transcript = (data.transcript || "").trim();
        setResult(transcript, data.intent);
        if (data.intent) {
          setStatus(data.intent, "ok");
          log(`${JSON.stringify(transcript)} -> ${data.intent}`);
        } else {
          setStatus(transcript ? "Transcribed" : "Empty", transcript ? "ok" : "err");
          log(transcript ? `transcript: ${JSON.stringify(transcript)}` : "empty transcript");
        }
      } catch (error) {
        setStatus("Failed", "err");
        log(`transcribe error: ${error.message || error}`);
      } finally {
        busy = false;
        talkBtn.disabled = false;
      }
    }

    function cleanupStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => track.stop());
      }
      mediaStream = null;
      mediaRecorder = null;
    }

    async function publishTranscript(text) {
      const transcript = text.trim();
      if (!transcript || busy) return;

      busy = true;
      sendTextBtn.disabled = true;
      setStatus("Publishing", "busy");
      try {
        const res = await fetch("/api/intent", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CS603-Voice-Token": demoToken
          },
          body: JSON.stringify({transcript})
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "publish failed");
        setResult(data.commandText || data.transcript || transcript, data.intent);
        setStatus(data.intent || "Published", "ok");
        log(`${JSON.stringify(data.commandText || transcript)} -> ${data.intent}`);
      } catch (error) {
        setStatus("Failed", "err");
        log(`publish error: ${error.message || error}`);
      } finally {
        busy = false;
        sendTextBtn.disabled = false;
      }
    }

    talkBtn.addEventListener("pointerdown", startRecording);
    talkBtn.addEventListener("pointerup", stopRecording);
    talkBtn.addEventListener("pointercancel", stopRecording);
    talkBtn.addEventListener("pointerleave", stopRecording);

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space" && document.activeElement !== manualTextEl) startRecording(event);
    });
    document.addEventListener("keyup", (event) => {
      if (event.code === "Space" && document.activeElement !== manualTextEl) stopRecording(event);
    });

    sendTextBtn.addEventListener("click", () => publishTranscript(manualTextEl.value));
    manualTextEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") publishTranscript(manualTextEl.value);
    });
    document.querySelectorAll("[data-phrase]").forEach((button) => {
      button.addEventListener("click", () => {
        manualTextEl.value = button.dataset.phrase;
        publishTranscript(button.dataset.phrase);
      });
    });
    micPickerEl.addEventListener("change", () => {
      selectedMicId = micPickerEl.value;
      log(`mic selected: ${micPickerEl.options[micPickerEl.selectedIndex].textContent}`);
    });

    health();
    populateMicPicker();
  </script>
</body>
</html>
