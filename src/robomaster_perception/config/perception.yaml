deepsort_tracker_node:
  ros__parameters:
    image_topic: /camera/image_color
    vision_topic: /vision
    output_topic: /people/tracks
    embedder: mobilenet
    embedder_gpu: true
    max_age: 15
    n_init: 2
    max_iou_distance: 0.9
    max_cosine_distance: 0.5

depth_estimator_node:
  ros__parameters:
    image_topic: /camera/image_color
    tracks_topic: /people/tracks
    depth_topic: /depth/image
    depth_viz_topic: /depth/image_viz
    people_depth_topic: /people/depth
    tof_topic: /range_0
    rate_hz: 4.0
    device: cuda
    model_name: depth-anything/Depth-Anything-V2-Metric-Indoor-Small-hf
    tof_stale_timeout_sec: 0.5
    tof_requires_centered_track: true
    tof_min_track_overlap_fraction: 0.25
    tof_max_scale_jump_ratio: 1.8
    default_depth_scale: 0.33
    min_scale: 0.2
    max_scale: 2.0
    depth_filter_alpha: 0.4
    depth_max_step_m: 0.25

face_identity_node:
  ros__parameters:
    image_topic: /camera/image_color
    tracks_topic: /people/tracks
    output_topic: /people/identities
    face_db_path: face_db/embeddings/face_db.npz
    rate_hz: 1.0
    threshold: 0.35
    model_name: buffalo_l
    det_size: 640
    crop_padding: 0.15
    identity_hold_sec: 10.0
    use_gpu: false

tracking_overlay_node:
  ros__parameters: {}
