[pytest]
markers =
    unit: pure unit tests that do not require ROS, Docker, or robot hardware

# Limit local-host pytest to packages with non-ROS unit tests. The teammate
# perception / follow packages ship ament_copyright/flake8/pep257 stubs that
# only run inside `colcon test` (they need ament_* Python packages installed).
testpaths =
    src/cs603_voice_intent/test
    tools/voice_web_demo
